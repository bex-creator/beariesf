<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P2P Neon Sumo Knockout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* slate-900 */
            touch-action: none; /* Prevent scroll on mobile */
        }
        canvas {
            display: block;
        }
        .glow-text-cyan {
            text-shadow: 0 0 15px rgba(34, 211, 238, 0.8);
        }
        .glow-text-fuchsia {
            text-shadow: 0 0 15px rgba(232, 121, 249, 0.8);
        }
    </style>
</head>
<body>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-6 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full font-bold text-white z-50 opacity-0 pointer-events-none transition-opacity duration-300 shadow-lg"></div>

    <!-- Main Menu UI -->
    <div id="ui-home" class="ui-panel absolute inset-0 flex flex-col items-center justify-center bg-slate-900 z-20 px-4">
        <h1 class="text-5xl md:text-7xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-fuchsia-500 mb-2 tracking-tighter drop-shadow-[0_5px_5px_rgba(0,0,0,0.5)]">SUMO KNOCKOUT</h1>
        <p class="text-slate-400 mb-10 text-center max-w-md">Knock your friend out of the neon ring! Use WASD/Arrows on Desktop, or use the on-screen joystick on Mobile.</p>
        
        <div class="flex flex-col md:flex-row gap-6">
            <button onclick="showHostMenu()" class="px-8 py-4 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-full shadow-[0_0_20px_rgba(8,145,178,0.6)] transition-all transform hover:scale-105">Create Game</button>
            <button onclick="showJoinMenu()" class="px-8 py-4 bg-fuchsia-600 hover:bg-fuchsia-500 text-white font-bold rounded-full shadow-[0_0_20px_rgba(192,38,211,0.6)] transition-all transform hover:scale-105">Join Game</button>
        </div>
    </div>

    <!-- Host Menu UI -->
    <div id="ui-host" class="ui-panel hidden absolute inset-0 flex flex-col items-center justify-center bg-slate-900 z-20 px-4">
        <h2 class="text-3xl font-bold text-cyan-400 mb-6 glow-text-cyan">Host a Game</h2>
        <div class="bg-slate-800 p-8 rounded-2xl border border-cyan-500 shadow-[0_0_30px_rgba(8,145,178,0.3)] text-center max-w-md w-full">
            <p class="text-slate-300 mb-2">Share this Room ID with your friend:</p>
            <div class="bg-slate-900 p-4 rounded-lg font-mono text-cyan-300 break-all mb-4 border border-slate-700" id="host-id">Generating...</div>
            <button onclick="copyId()" class="w-full px-6 py-3 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-lg transition-colors mb-6">Copy ID</button>
            
            <div class="flex items-center justify-center space-x-2 text-cyan-500 animate-pulse">
                <svg class="animate-spin h-5 w-5" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                <span>Waiting for opponent...</span>
            </div>
        </div>
        <button onclick="switchUI('ui-home')" class="mt-8 text-slate-400 hover:text-white transition-colors">← Back to Menu</button>
    </div>

    <!-- Join Menu UI -->
    <div id="ui-join" class="ui-panel hidden absolute inset-0 flex flex-col items-center justify-center bg-slate-900 z-20 px-4">
        <h2 class="text-3xl font-bold text-fuchsia-400 mb-6 glow-text-fuchsia">Join a Game</h2>
        <div class="bg-slate-800 p-8 rounded-2xl border border-fuchsia-500 shadow-[0_0_30px_rgba(192,38,211,0.3)] text-center max-w-md w-full">
            <p class="text-slate-300 mb-4">Enter your friend's Room ID:</p>
            <input type="text" id="join-id" class="w-full bg-slate-900 text-white rounded-lg px-4 py-3 border border-slate-600 focus:outline-none focus:border-fuchsia-500 focus:ring-1 focus:ring-fuchsia-500 mb-6 font-mono text-center" placeholder="Paste ID here">
            <button onclick="joinGame()" class="w-full px-6 py-3 bg-fuchsia-600 hover:bg-fuchsia-500 text-white font-bold rounded-lg transition-colors" id="btn-join">Connect</button>
        </div>
        <button onclick="switchUI('ui-home')" class="mt-8 text-slate-400 hover:text-white transition-colors">← Back to Menu</button>
    </div>

    <!-- In-Game HUD -->
    <div id="ui-game" class="ui-panel hidden absolute inset-0 pointer-events-none flex justify-between items-start p-4 md:p-8 z-10">
        <div class="flex flex-col items-start">
            <span class="text-cyan-400 font-black text-sm tracking-widest opacity-75">HOST</span>
            <span id="score-p1" class="text-white text-5xl md:text-6xl font-black glow-text-cyan">0</span>
        </div>
        <div class="flex flex-col items-end">
            <span class="text-fuchsia-400 font-black text-sm tracking-widest opacity-75">GUEST</span>
            <span id="score-p2" class="text-white text-5xl md:text-6xl font-black glow-text-fuchsia">0</span>
        </div>
    </div>

    <canvas id="gameCanvas" class="hidden absolute inset-0 w-full h-full"></canvas>

    <script>
        // UI & Global Utilities
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let isPlaying = false;
        let isHost = false;
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function switchUI(id) {
            document.querySelectorAll('.ui-panel').forEach(p => p.classList.add('hidden'));
            if(id) document.getElementById(id).classList.remove('hidden');
        }

        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.className = `fixed top-6 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full font-bold text-white z-50 transition-opacity duration-300 shadow-lg ${isError ? 'bg-red-500' : 'bg-emerald-500'}`;
            t.style.opacity = 1;
            setTimeout(() => t.style.opacity = 0, 3000);
        }

        function copyId() {
            const id = document.getElementById('host-id').innerText;
            if(!id || id === 'Generating...') return;
            navigator.clipboard.writeText(id).then(() => {
                showToast('Room ID Copied!');
            }).catch(() => {
                const textArea = document.createElement("textarea");
                textArea.value = id;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand("copy");
                textArea.remove();
                showToast('Room ID Copied!');
            });
        }

        let peer = null;
        let conn = null;

        function initPeer(onOpen) {
            if (peer) peer.destroy();
            peer = new Peer(); // Free public signaling server
            peer.on('open', onOpen);
            peer.on('error', err => {
                console.error(err);
                showToast(err.type === 'peer-unavailable' ? 'Could not find that Room ID!' : 'Network Error.', true);
                document.getElementById('btn-join').innerText = 'Connect';
            });
            peer.on('disconnected', () => {
                showToast('Disconnected from signaling server. P2P may still work.');
            });
        }

        function showHostMenu() {
            switchUI('ui-host');
            document.getElementById('host-id').innerText = 'Generating...';
            initPeer((id) => {
                document.getElementById('host-id').innerText = id;
                peer.on('connection', c => {
                    conn = c;
                    isHost = true;
                    setupConnection();
                });
            });
        }

        function joinGame() {
            const id = document.getElementById('join-id').value.trim();
            if(!id) return showToast('Please enter a Room ID.', true);
            
            const btn = document.getElementById('btn-join');
            btn.innerText = 'Connecting...';
            
            initPeer(() => {
                conn = peer.connect(id, { reliable: true });
                conn.on('open', () => {
                    isHost = false;
                    setupConnection();
                });
            });
        }

        function setupConnection() {
            switchUI('ui-game');
            canvas.classList.remove('hidden');
            isPlaying = true;
            showToast('Connected! Get Ready.');

            conn.on('data', (data) => {
                if (isHost && data.type === 'input') {
                    remoteInputs = data.data;
                } else if (!isHost && data.type === 'state') {
                    gameState = data.data;
                }
            });

            conn.on('close', () => {
                showToast('Opponent disconnected!', true);
                isPlaying = false;
                setTimeout(() => location.reload(), 2000);
            });

            if (isHost) {
                resetRound();
            }
        }

        let localInputs = { up: false, down: false, left: false, right: false };
        let remoteInputs = { up: false, down: false, left: false, right: false };
        let joystick = { active: false, baseX: 0, baseY: 0, stickX: 0, stickY: 0 };

        // Keyboard
        window.addEventListener('keydown', e => {
            if(e.code === 'ArrowUp' || e.code === 'KeyW') localInputs.up = true;
            if(e.code === 'ArrowDown' || e.code === 'KeyS') localInputs.down = true;
            if(e.code === 'ArrowLeft' || e.code === 'KeyA') localInputs.left = true;
            if(e.code === 'ArrowRight' || e.code === 'KeyD') localInputs.right = true;
        });
        window.addEventListener('keyup', e => {
            if(e.code === 'ArrowUp' || e.code === 'KeyW') localInputs.up = false;
            if(e.code === 'ArrowDown' || e.code === 'KeyS') localInputs.down = false;
            if(e.code === 'ArrowLeft' || e.code === 'KeyA') localInputs.left = false;
            if(e.code === 'ArrowRight' || e.code === 'KeyD') localInputs.right = false;
        });
        window.addEventListener('blur', () => {
            localInputs = { up: false, down: false, left: false, right: false };
        });

        // Touch Virtual Joystick
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            joystick.active = true;
            joystick.baseX = e.touches[0].clientX;
            joystick.baseY = e.touches[0].clientY;
            joystick.stickX = e.touches[0].clientX;
            joystick.stickY = e.touches[0].clientY;
            updateJoystick();
        }, {passive: false});

        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            if(joystick.active) {
                joystick.stickX = e.touches[0].clientX;
                joystick.stickY = e.touches[0].clientY;
                updateJoystick();
            }
        }, {passive: false});

        canvas.addEventListener('touchend', e => {
            e.preventDefault();
            joystick.active = false;
            localInputs = { up: false, down: false, left: false, right: false };
        });

        function updateJoystick() {
            const dx = joystick.stickX - joystick.baseX;
            const dy = joystick.stickY - joystick.baseY;
            const dist = Math.sqrt(dx*dx + dy*dy);
            const maxDist = 60;
            
            if (dist > maxDist) {
                joystick.stickX = joystick.baseX + (dx / dist) * maxDist;
                joystick.stickY = joystick.baseY + (dy / dist) * maxDist;
            }

            localInputs.up = dy < -20;
            localInputs.down = dy > 20;
            localInputs.left = dx < -20;
            localInputs.right = dx > 20;
        }

        let gameState = {
            status: 'lobby', // 'countdown', 'playing', 'round_over'
            countdown: 3,
            bumpCount: 0,
            p1: { x: -150, y: 0, vx: 0, vy: 0, score: 0, radius: 25 },
            p2: { x: 150, y: 0, vx: 0, vy: 0, score: 0, radius: 25 },
            arena: { radius: Math.min(window.innerWidth, window.innerHeight) * 0.4 } // Responsive arena
        };

        function resetRound() {
            gameState.arena.radius = Math.min(window.innerWidth, window.innerHeight) * 0.4;
            if(gameState.arena.radius < 150) gameState.arena.radius = 150;

            gameState.p1.x = -gameState.arena.radius / 2;
            gameState.p1.y = 0;
            gameState.p1.vx = 0;
            gameState.p1.vy = 0;
            
            gameState.p2.x = gameState.arena.radius / 2;
            gameState.p2.y = 0;
            gameState.p2.vx = 0;
            gameState.p2.vy = 0;
            
            gameState.status = 'countdown';
            gameState.countdown = 3;
            
            let countInterval = setInterval(() => {
                gameState.countdown--;
                if (gameState.countdown <= 0) {
                    clearInterval(countInterval);
                    gameState.status = 'playing';
                }
            }, 1000);
        }

        function updatePhysics() {
            if (gameState.status !== 'playing') return;

            const accel = 0.8;
            const friction = 0.96;
            const maxSpeed = 22;

            // Apply Movement
            if (localInputs.up) gameState.p1.vy -= accel;
            if (localInputs.down) gameState.p1.vy += accel;
            if (localInputs.left) gameState.p1.vx -= accel;
            if (localInputs.right) gameState.p1.vx += accel;

            if (remoteInputs.up) gameState.p2.vy -= accel;
            if (remoteInputs.down) gameState.p2.vy += accel;
            if (remoteInputs.left) gameState.p2.vx -= accel;
            if (remoteInputs.right) gameState.p2.vx += accel;

            // Apply Friction
            gameState.p1.vx *= friction;
            gameState.p1.vy *= friction;
            gameState.p2.vx *= friction;
            gameState.p2.vy *= friction;

            // Clamp Speed
            let speed1 = Math.sqrt(gameState.p1.vx**2 + gameState.p1.vy**2);
            if (speed1 > maxSpeed) {
                gameState.p1.vx = (gameState.p1.vx / speed1) * maxSpeed;
                gameState.p1.vy = (gameState.p1.vy / speed1) * maxSpeed;
            }
            let speed2 = Math.sqrt(gameState.p2.vx**2 + gameState.p2.vy**2);
            if (speed2 > maxSpeed) {
                gameState.p2.vx = (gameState.p2.vx / speed2) * maxSpeed;
                gameState.p2.vy = (gameState.p2.vy / speed2) * maxSpeed;
            }

            // Move
            gameState.p1.x += gameState.p1.vx;
            gameState.p1.y += gameState.p1.vy;
            gameState.p2.x += gameState.p2.vx;
            gameState.p2.y += gameState.p2.vy;

            // Collision Check (Circle vs Circle)
            let dx = gameState.p2.x - gameState.p1.x;
            let dy = gameState.p2.y - gameState.p1.y;
            let dist = Math.sqrt(dx * dx + dy * dy);
            let minDist = gameState.p1.radius + gameState.p2.radius;

            if (dist < minDist && dist !== 0) {
                gameState.bumpCount++;
                
                // Separate to prevent sticking
                let overlap = minDist - dist;
                let nx = dx / dist;
                let ny = dy / dist;

                gameState.p1.x -= nx * overlap / 2;
                gameState.p1.y -= ny * overlap / 2;
                gameState.p2.x += nx * overlap / 2;
                gameState.p2.y += ny * overlap / 2;

                // Momentum exchange with bounce multiplier
                let kx = gameState.p1.vx - gameState.p2.vx;
                let ky = gameState.p1.vy - gameState.p2.vy;
                let p = (nx * kx + ny * ky); 
                
                if (p > 0) { // Only bounce if moving towards each other
                    let bounce = 1.3;
                    gameState.p1.vx -= p * nx * bounce;
                    gameState.p1.vy -= p * ny * bounce;
                    gameState.p2.vx += p * nx * bounce;
                    gameState.p2.vy += p * ny * bounce;
                }
            }

            // Arena Bounds Check (Falling out)
            let d1 = Math.sqrt(gameState.p1.x**2 + gameState.p1.y**2);
            let d2 = Math.sqrt(gameState.p2.x**2 + gameState.p2.y**2);

            if (d1 > gameState.arena.radius) {
                handleRoundOver('p2'); // P1 fell, P2 wins
            } else if (d2 > gameState.arena.radius) {
                handleRoundOver('p1'); // P2 fell, P1 wins
            }
        }

        function handleRoundOver(winner) {
            gameState.status = 'round_over';
            if (winner === 'p1') gameState.p1.score++;
            if (winner === 'p2') gameState.p2.score++;
            setTimeout(resetRound, 2500);
        }

        let particles = [];
        let lastBumpCount = 0;
        let arenaPulse = 0;

        function spawnParticles(x, y) {
            for(let i=0; i<20; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random()-0.5)*15,
                    vy: (Math.random()-0.5)*15,
                    life: 1.0,
                    color: Math.random() > 0.5 ? '#22d3ee' : '#e879f9'
                });
            }
        }

        function drawEntities() {
            // Check for bumps triggered over network
            if (gameState.bumpCount > lastBumpCount) {
                spawnParticles((gameState.p1.x + gameState.p2.x)/2, (gameState.p1.y + gameState.p2.y)/2);
                arenaPulse = 1.0;
                lastBumpCount = gameState.bumpCount;
            }

            // Draw Arena
            arenaPulse = Math.max(0, arenaPulse - 0.05);
            ctx.beginPath();
            ctx.arc(0, 0, gameState.arena.radius, 0, Math.PI*2);
            ctx.strokeStyle = `rgba(255, 255, 255, ${0.15 + arenaPulse*0.5})`;
            ctx.lineWidth = 4 + (arenaPulse * 10);
            ctx.stroke();

            // Draw Particles
            for(let i=particles.length-1; i>=0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.vx *= 0.9; p.vy *= 0.9;
                p.life -= 0.04;
                if(p.life <= 0) {
                    particles.splice(i, 1);
                } else {
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
                    ctx.fill();
                }
            }
            ctx.globalAlpha = 1.0;

            // Helper to draw player
            const drawPlayer = (p, color) => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2);
                ctx.fillStyle = color;
                ctx.shadowColor = color;
                ctx.shadowBlur = 20;
                ctx.fill();
                ctx.shadowBlur = 0; // Reset
            };

            // Draw Players (if they haven't fallen out significantly)
            let d1 = Math.sqrt(gameState.p1.x**2 + gameState.p1.y**2);
            if (d1 < gameState.arena.radius + 50) drawPlayer(gameState.p1, '#22d3ee'); // Cyan

            let d2 = Math.sqrt(gameState.p2.x**2 + gameState.p2.y**2);
            if (d2 < gameState.arena.radius + 50) drawPlayer(gameState.p2, '#e879f9'); // Fuchsia
        }

        const TICK_RATE = 60;
        const TICK_MS = 1000 / TICK_RATE;
        let lastTime = performance.now();
        let accumulator = 0;

        function gameLoop(time) {
            requestAnimationFrame(gameLoop);
            
            if (!isPlaying) return;

            // Update UI Scores
            document.getElementById('score-p1').innerText = gameState.p1.score;
            document.getElementById('score-p2').innerText = gameState.p2.score;

            // Fixed Timestep Logic Update
            let dt = time - lastTime;
            lastTime = time;
            accumulator += dt;
            
            while (accumulator >= TICK_MS) {
                if (isHost) {
                    updatePhysics();
                    if (conn && conn.open) {
                        conn.send({ type: 'state', data: gameState });
                    }
                } else {
                    if (conn && conn.open) {
                        conn.send({ type: 'input', data: localInputs });
                    }
                }
                accumulator -= TICK_MS;
            }
            
            // --- Rendering ---
            
            // Motion Blur Trail Effect
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = 'rgba(15, 23, 42, 0.3)'; // Dark background with alpha for trails
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Center Camera
            ctx.translate(canvas.width/2, canvas.height/2);
            ctx.globalCompositeOperation = 'lighter'; // Additive blending for neon effect

            drawEntities();

            // Draw Game State Overlays
            ctx.globalCompositeOperation = 'source-over';
            if (gameState.status === 'countdown') {
                ctx.fillStyle = 'white';
                ctx.font = '900 120px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 10;
                ctx.fillText(gameState.countdown, 0, 0);
                ctx.shadowBlur = 0;
            } else if (gameState.status === 'round_over') {
                ctx.fillStyle = 'white';
                ctx.font = '900 60px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText("KNOCKOUT!", 0, -30);
            }

            // Draw Virtual Joystick (Top layer, static position)
            if (joystick.active) {
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.beginPath();
                ctx.arc(joystick.baseX, joystick.baseY, 60, 0, Math.PI*2);
                ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                ctx.beginPath();
                ctx.arc(joystick.stickX, joystick.stickY, 25, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.fill();
            }
        }

        // Start the engine
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
